<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LAYRS</title>
<meta name="description" content="A Dutch city building by building, coloured by the year each was built, with layers from the national monument register.">
<meta property="og:type" content="website">
<meta property="og:title" content="LAYRS">
<meta property="og:description" content="A Dutch city building by building, coloured by the year each was built.">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="logo.js" defer></script>
</head>
<body>
<noscript><p style="padding:24px;font:16px sans-serif">This map needs JavaScript.</p></noscript>
<canvas id="scene" aria-label="3D map of the city's buildings"></canvas>
<div class="veil veil-top" aria-hidden="true"></div>
<div class="veil veil-bottom" aria-hidden="true"></div>

<header class="masthead">
  
  <div>
    <h1><span class="layrs" aria-label="LAYRS">LAYRS</span> <i class="baseline"></i></h1>
    <p class="dek">Every building standing today, by age and historical context.</p>
  </div>
</header>

<div class="find" role="search">
  <input type="search" id="find-input" autocomplete="off" spellcheck="false" placeholder="Search"
    aria-label="Search a building, address or street" aria-controls="find-results" aria-expanded="false">
  <ul id="find-results" class="find-results" role="listbox" hidden></ul>
  <div id="find-sel" class="find-sel" hidden></div>
</div>

<nav class="modes" aria-label="Colour the city by">
  <button data-mode="0" aria-pressed="true">Period</button>
  <button data-mode="3" aria-pressed="false">Layers</button>
  <a class="graph-open" href="graph.html"><span>Graph</span></a>
  <span class="modes-sep" aria-hidden="true"></span>
  <button class="walks-open" aria-haspopup="dialog"><span>Walk</span></button>
</nav>

<div class="lang" role="group" aria-label="Language">
  <button class="about-open" aria-haspopup="dialog">About</button>
  <button data-lang="en" aria-pressed="true">EN</button><button data-lang="nl" aria-pressed="false">NL</button>
</div>

<button class="gz-toggle" aria-pressed="false" hidden><i aria-hidden="true"></i><span>Protected townscapes</span></button>
<button class="arch-toggle" aria-pressed="false" hidden><i aria-hidden="true"></i><span>Archaeology</span></button>

<dialog id="about" class="about" aria-labelledby="about-title">
  <button class="about-close" aria-label="Close">×</button>
  <article lang="en" data-lang-block="en"><h2 id="about-title">About this map</h2></article>
  <article lang="nl" data-lang-block="nl" hidden><h2>Over deze kaart</h2></article>
</dialog>

<div class="tally" aria-live="polite">
  <span id="year" class="tally-year">&nbsp;</span>
  <span class="tally-count"><span id="count">0</span> buildings</span>
</div>

<aside id="panel" class="panel collapsed">
  <button class="sheet-handle" aria-expanded="true" aria-controls="panel-body">Legend</button>
  <div id="panel-body"></div>
</aside>

<div id="card" class="card" hidden></div>
<section id="focus" class="focusbox" hidden aria-live="polite"></section>
<section id="walk" class="walkcard" hidden aria-live="polite"></section>
<dialog id="walks" class="about walks" aria-labelledby="walks-title">
  <button class="about-close" aria-label="Close">×</button>
  <article id="walks-body"></article>
</dialog>
<p class="howto">Drag to turn. Right-drag or Shift-drag to move. Scroll to zoom.</p>
<div class="zoom" role="group" aria-label="Zoom">
  <button class="zoom-in" aria-label="Zoom in" title="Zoom in"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg></button>
  <button class="zoom-out" aria-label="Zoom out" title="Zoom out"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10"/></svg></button>
  <button class="zoom-home" aria-label="Overview" title="Overview"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/></svg></button>
</div>

<footer class="timeline">
  <button id="play" class="play" aria-label="Play the city's growth">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path id="play-icon" d="M4 2.5v11l9-5.5z"/></svg>
  </button>
  <button id="repeat" class="repeat" aria-pressed="false" aria-label="Repeat" title="Repeat">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 7.5V6.5A2.5 2.5 0 0 1 5.5 4H12M10 2l2 2-2 2M13 8.5v1A2.5 2.5 0 0 1 10.5 12H4M6 14l-2-2 2-2"/></svg>
  </button>
  <canvas id="hist" aria-label="Buildings per year; drag to set the year"></canvas>
</footer>

<div id="loading" class="loading">Building the city <span id="progress">0</span>%</div>
<script type="module" src="app.js"></script>
</body>
</html>
